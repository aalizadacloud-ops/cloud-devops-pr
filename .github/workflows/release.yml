name: Release to Production

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build-release:
    name: Validate, Build, Scan and Push Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.12.4"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use semantic version format, for example v1.0.0"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image for security scan
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ env.RELEASE_TAG }}

      - name: Scan release image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ env.RELEASE_TAG }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned image to GHCR
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-production:
    name: Deploy to Production
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: prod

    steps:
      - name: Deploy release image to production
        run: echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }} to production"

      - name: Run mocked production smoke test
        run: echo "Mock smoke test passed for production release ${{ env.RELEASE_TAG }}"

      - name: Mock rollback
        if: failure()
        run: echo "Rolling back production from ${{ env.RELEASE_TAG }} to the previous stable release"